<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Приборная панель Edtech KPI</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" integrity="sha384-cCVCZkAjYNxaYKbM8lsArLznDF/SvMFr1jcZrvOpSTCa0W40ZAdLzHCEulnUa5i7" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0B0F1A;--card:#151E31;--card2:#1B2740;--line:#243049;
  --tx:#E8EDF7;--dim:#8FA0BF;--acc:#3B82F6;--ok:#22C55E;--bad:#EF4444;--vi:#A855F7;
}
body{background:var(--bg);color:var(--tx);
  font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;-webkit-text-size-adjust:100%}

/* ── шлюз пароля ── */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gbox{width:100%;max-width:420px;background:linear-gradient(160deg,#151E31,#101827);
  border:1px solid var(--line);border-radius:20px;padding:36px 28px;
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
.gtitle{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.gsub{color:var(--dim);font-size:14px;margin-bottom:26px}
.grow{display:flex;flex-direction:column;gap:14px}
label{font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim)}
input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:15px 16px;color:var(--tx);font-size:17px;font-family:inherit}
input[type=password]:focus{outline:none;border-color:var(--acc);
  box-shadow:0 0 0 3px rgba(59,130,246,.25)}
button{width:100%;background:linear-gradient(135deg,#3B82F6,#6366F1);
  border:0;border-radius:12px;padding:15px;color:#fff;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit}
button:disabled{opacity:.55;cursor:wait}
.gmsg{margin-top:16px;min-height:20px;font-size:14px;text-align:center;color:var(--bad)}
.ghint{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--dim);font-size:12.5px;line-height:1.6}
.lock{display:inline-flex;align-items:center;gap:7px;font-size:12px;
  color:var(--ok);font-weight:700;margin-bottom:14px}

/* ── панель (скрыта до ввода пароля) ── */
#app{display:none;padding:20px;max-width:1560px;margin:0 auto}
h1{font-size:32px;font-weight:800;letter-spacing:-.6px;margin-bottom:4px;text-align:center}
.sub{color:var(--dim);font-size:15px;margin-bottom:22px}
.howto{color:var(--dim);font-size:12px;margin-bottom:16px;line-height:1.5}

.months{display:flex;gap:10px;margin:12px 0 20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px 17px;border-top:3px solid var(--acc)}
.kpi.green{border-top-color:var(--ok)}.kpi.red{border-top-color:var(--bad)}.kpi.violet{border-top-color:var(--vi)}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--dim);
  text-transform:uppercase;margin-bottom:7px}
.val{font-size:31px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
.sub2{margin-top:7px;font-size:14.5px;font-weight:700;color:var(--dim)}
.sub2.g{color:var(--ok)}.sub2.r{color:#FF6B6B}.sub2.y{color:#FFB020}.sub2.v{color:var(--vi)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card h3{font-size:19px;font-weight:800;padding:15px 18px;letter-spacing:-.2px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card h3::before{content:"";width:4px;height:18px;border-radius:3px;background:var(--acc)}
.card.g h3::before{background:var(--ok)}.card.v h3::before{background:var(--vi)}
.card.r h3::before{background:var(--bad)}
.ch{height:300px}
.calwrap{margin-bottom:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px}
.cal i{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:5px;background:var(--card2);color:var(--dim);font-style:normal;
  font-size:10px;font-weight:700;border:1px solid transparent;cursor:pointer;
  transition:background .15s}
.cal i:hover{background:var(--acc);color:#fff}
.cal h{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:transparent;color:var(--acc);font-style:normal;
  font-size:10px;font-weight:800;border:1px solid transparent;text-transform:uppercase}
.cal i.d1{background:#1E3A5F;color:#BFDBFE}
.cal i.d2{background:#2563EB;color:#fff}
.cal i.d3{background:#7C3AED;color:#fff}
.cal i.d4{background:#A855F7;color:#fff;box-shadow:0 0 0 1px #C084FC}

/* ── дашборды: 2 колонки горизонтально ── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}

/* ── таблица августа ── */
.augtbl{width:100%;border-collapse:collapse;font-size:13px}
.augtbl th{background:var(--card2);color:var(--dim);font-weight:800;font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;text-align:left;
  border-bottom:2px solid var(--line)}
.augtbl td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--tx)}
.augtbl tr:hover td{background:rgba(59,130,246,.06)}
.augtbl .nz{color:var(--ok);font-weight:700}
.augtbl .zero{color:var(--dim)}

.rules{margin-top:14px;padding:18px 20px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;color:var(--dim);font-size:14px;line-height:1.75}
.rules h4{color:var(--tx);font-size:17px;font-weight:800;margin-bottom:10px}
.rules b{color:#93C5FD}

/* ── пустой дашборд (placeholder) ── */
.card-empty{border-top:3px solid var(--dim);opacity:.55}
.card-empty h3::before{background:var(--dim)}
.empty-msg{padding:40px 18px;text-align:center;color:var(--dim);font-size:14px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{animation:fadeIn .4s ease both}
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.15s}
.card:nth-child(4){animation-delay:.2s}
.card:nth-child(5){animation-delay:.25s}
.card:nth-child(6){animation-delay:.3s}

.popup{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:none;
  align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
.popup-box{background:linear-gradient(160deg,#1A2540,#151E31);border:1px solid var(--line);
  border-radius:20px;padding:26px 28px;max-width:440px;width:100%;max-height:82vh;
  overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 40px rgba(59,130,246,.15)}
.popup-box h2{font-size:21px;margin-bottom:14px;color:#93C5FD}
.popup-close{float:right;background:none;border:none;color:var(--tx);font-size:20px;cursor:pointer;padding:0 0 8px}
.prow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.prow .pl{color:var(--dim)}.prow .pv{font-weight:700}
.prow.empty{opacity:.45}
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <div class="lock">&#128274; Закрытая панель</div>
    <div class="gtitle">Приборная панель</div>
    <div class="gsub">Edtech KPI &middot; закрытый контур</div>
    <form id="gform" class="grow" autocomplete="off">
      <div>
        <label for="pw">Пароль</label>
        <input id="pw" type="password" placeholder="Введите пароль" autofocus>
      </div>
      <button id="go" type="submit">Показать панель</button>
    </form>
    <div class="gmsg" id="gmsg"></div>
    <div class="ghint">
      Страница закрыта шифрованием AES-256-GCM. Данные не отправляются на
      сервер и не хранятся открытым текстом &mdash; они появляются только
      после ввода пароля, прямо в этом браузере.
    </div>
  </div>
</div>

<div id="app">
  <h1>Приборная панель</h1>
  <div class="months" id="months">
    <button class="tog on" data-m="sep">Сентябрь</button>
    <button class="tog off" data-m="aug">Август</button>
  </div>
  <div id="kpis" class="kpis"></div>
  <div class="card calwrap"><h3>Активность по дням</h3>
    <div class="cal" id="cal"></div></div>
  <div class="grid" id="grid"></div>
</div>

  var ITER = 600000;

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(password, salt) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function decryptPayload(password) {
    var salt = b64ToBytes(SALT_B64);
    var iv = b64ToBytes(IV_B64);
    var data = b64ToBytes(CIPHER_B64);
    var key = await deriveKey(password, salt);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
    return JSON.parse(new TextDecoder().decode(plain));
  }

  var attempts = 0;
  var LOCKED_UNTIL = 0;

  window.PANEL_UNLOCK = async function (password) {
    var now = Date.now();
    if (now < LOCKED_UNTIL) {
      return { ok: false, error: "Слишком много попыток. Подождите " +
              Math.ceil((LOCKED_UNTIL - now) / 1000) + " с." };
    }
    if (!password) return { ok: false, error: "Введите пароль" };
    try {
      var payload = await decryptPayload(password);
      return { ok: true, payload: payload };
    } catch (e) {
      attempts++;
      if (attempts >= 5) {
        LOCKED_UNTIL = Date.now() + 60000;
        attempts = 0;
        return { ok: false, error: "5 неверных попыток. Пауза 60 секунд." };
      }
      return { ok: false, error: "Неверный пароль (попытка " + attempts + " из 5)" };
    }
  };

  // Показать/скрыть панель
  window.PANEL_SHOW = function (payload) {
    var gate = document.getElementById("gate");
    if (gate) gate.style.display = "none";
    var app = document.getElementById("app");
    if (app) app.style.display = "block";
    if (window.__RENDER) window.__RENDER(payload);
  };
})();

window.__ACTIVE = 'sep';
window.__RENDER = function (p) {
  var m = p.months || {sep: p};
  var key = p.active || 'sep';
  var dd = m[key];
  if (!dd) return;
  window.__MONTHS = m;
  window.__ACTIVE = key;

  document.getElementById("calmonth").textContent = "";
  document.getElementById("kpis").innerHTML = dd.kpi;
  document.getElementById("cal").innerHTML = dd.cal;

  var order = [
    ["g1", "План / факт / регистрации  \u00b7  " + fmtNum(figTotal(dd.fig.g1), 0) + " рег", ""],
    ["g2", "Регистрации по дням  \u00b7  " + fmtNum(figTotal(dd.fig.g2), 0) + " всего", "v"],
    ["g3", "Клики и CTR  \u00b7  " + fmtNum(figTotal(dd.fig.g3), 0) + " кликов", "g"],
    ["g4", "CPC / CPM  \u00b7  CPC $" + fmtNum(figTotal(dd.fig.g4), 2), ""],
    ["g5", "Конверсия подписная  \u00b7  " + fmtNum(figTotal(dd.fig.g5), 1) + "%", "v"],
    ["g6", "Показы  \u00b7  " + fmtNum(figTotal(dd.fig.g6), 0), "g"]
  ];

  function figTotal(f){
    var t = f.data[0];
    var arr = t && (t.y || t.x) || [];
    return arr.reduce(function(a,b){return a + (parseFloat(b)||0)},0);
  }
  function fmtNum(n, d){
    if(n == null || isNaN(n)) return "\u2014";
    return Number(n).toFixed(d || 0);
  }

  var grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (key === 'aug') {
    /* ── Август: таблица из данных fig ── */
    var fig = dd.fig || {};
    var dates = (fig.g1 && fig.g1.data && fig.g1.data[0] && fig.g1.data[0].x) || [];
    var planY = (fig.g1 && fig.g1.data && fig.g1.data[0] && fig.g1.data[0].y) || [];
    var factY = (fig.g1 && fig.g1.data && fig.g1.data[1] && fig.g1.data[1].y) || [];
    var regY = (fig.g2 && fig.g2.data && fig.g2.data[0] && fig.g2.data[0].y) || [];
    var clicksY = (fig.g3 && fig.g3.data && fig.g3.data[0] && fig.g3.data[0].y) || [];
    var ctrY = (fig.g3 && fig.g3.data && fig.g3.data[1] && fig.g3.data[1].y) || [];
    var cpcY = (fig.g4 && fig.g4.data && fig.g4.data[0] && fig.g4.data[0].y) || [];
    var cpmY = (fig.g4 && fig.g4.data && fig.g4.data[1] && fig.g4.data[1].y) || [];
    var convY = (fig.g5 && fig.g5.data && fig.g5.data[0] && fig.g5.data[0].y) || [];
    var viewsY = (fig.g6 && fig.g6.data && fig.g6.data[0] && fig.g6.data[0].y) || [];

    var tbl = document.createElement("table");
    tbl.className = "augtbl";
    var headers = ["День","План","Факт","Рег","Клики","CTR","CPC","CPM","Конв.","Показы"];
    var tr = document.createElement("tr");
    headers.forEach(function(h){
      var th = document.createElement("th");
      th.textContent = h;
      tr.appendChild(th);
    });
    tbl.appendChild(tr);

    for (var i = 0; i < dates.length; i++) {
      var day = dates[i].slice(8);
      var plan = planY[i] || 0;
      var fact = factY[i] || 0;
      var reg = regY[i] || 0;
      var clicks = clicksY[i] || 0;
      var ctr = ctrY[i];
      var cpc = cpcY[i];
      var cpm = cpmY[i];
      var conv = convY[i];
      var views = viewsY[i] || 0;

      if (plan === 0 && fact === 0 && reg === 0 && clicks === 0 && !ctr && !cpc && !cpm && !conv && views === 0) continue;

      var tr = document.createElement("tr");
      var vals = [
        day + " авг",
        plan > 0 ? "$" + fmtNum(plan, 0) : "\u2014",
        fact > 0 ? "$" + fmtNum(fact, 2) : "\u2014",
        reg > 0 ? fmtNum(reg, 0) : "\u2014",
        clicks > 0 ? fmtNum(clicks, 0) : "\u2014",
        ctr != null ? ctr.toFixed(2) + "%" : "\u2014",
        cpc != null ? "$" + fmtNum(cpc, 2) : "\u2014",
        cpm != null ? "$" + fmtNum(cpm, 2) : "\u2014",
        conv != null ? conv.toFixed(1) + "%" : "\u2014",
        views > 0 ? fmtNum(views, 0) : "\u2014"
      ];
      vals.forEach(function(v, idx){
        var td = document.createElement("td");
        td.textContent = v;
        if (v !== "\u2014") td.className = "nz";
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    }
    grid.appendChild(tbl);
    return;
  }

  /* ── Сентябрь / общий: графики ── */
  order.forEach(function (row) {
    var k = row[0], title = row[1], cls = row[2];
    var card = document.createElement("div");
    card.className = "card " + cls;
    card.id = "card_" + k;

    if (!dd.fig[k] || !dd.fig[k].data || !dd.fig[k].data[0] || dd.fig[k].data[0].y.length === 0) {
      card.className += " card-empty";
      var h = document.createElement("h3");
      h.textContent = title;
      var msg = document.createElement("div");
      msg.className = "empty-msg";
      msg.textContent = "\u041d\u0435\u0442 \u0434\u0430\u043d\u043d\u044b\u0445";
      card.appendChild(h);
      card.appendChild(msg);
      grid.appendChild(card);
      return;
    }

    var h = document.createElement("h3");
    h.textContent = title;
    var ch = document.createElement("div");
    ch.className = "ch";
    ch.id = "c_" + k;
    card.appendChild(h);
    card.appendChild(ch);
    grid.appendChild(card);
    Plotly.newPlot("c_" + k, dd.fig[k].data, dd.fig[k].layout, dd.fig[k].config);
  });
};

document.getElementById("gform").addEventListener("submit", async function (ev) {
  ev.preventDefault();
  var btn = document.getElementById("go");
  var msg = document.getElementById("gmsg");
  btn.disabled = true;
  msg.textContent = "Проверя\u044e\u2026";
  msg.style.color = "var(--dim)";
  var res = await window.PANEL_UNLOCK(document.getElementById("pw").value);
  btn.disabled = false;
  if (res.ok) {
    msg.textContent = "\u041e\u0442\u043a\u0440\u044b\u0432\u0430\u044e\u2026";
    msg.style.color = "var(--ok)";
    window.PANEL_SHOW(res.payload);
  } else {
    msg.textContent = res.error;
    msg.style.color = "var(--bad)";
  }
});

<script>
function switchMonth(key){
  if(!window.__MONTHS || !window.__MONTHS[key]){
    if(key === 'aug'){
      document.getElementById("pdstats").innerHTML =
        '<div class="prow"><span class="pl">Август</span><span class="pv">данные будут добавлены</span></div>';
      document.getElementById("popup").style.display="flex";
    }
    return;
  }
  window.__ACTIVE = key;
  var btns = document.querySelectorAll("#months .tog");
  btns.forEach(function(b){
    var k = b.dataset.m;
    b.className = "tog " + (k === key ? "on" : "off");
  });
  window.__RENDER({months: window.__MONTHS, active: key});
}
document.getElementById("months").addEventListener("click", function(e){
  var b = e.target.closest("[data-m]");
  if(!b) return;
  switchMonth(b.dataset.m);
});
function closePopup(){document.getElementById("popup").style.display="none"}
function showDay(d){
  var m = window.__MONTHS || {sep: {}};
  var dd = m[window.__ACTIVE] || {};
  var fig = dd.fig || {};
  var idx = d-1;
  function val(f,ti){var t=(fig[f]||{}).data;if(!t)return null;for(var i=0;i<t.length;i++)if(t[i].name===ti)return t[i].y[idx]??null}

  var stats=[
    ["Регистрации",val("g2","Регистрации"),"","reg"],
    ["План",val("g1","План"),"$","plan"],
    ["Факт",val("g1","Факт"),"$","fact"],
    ["Клики",val("g3","Клики"),"","clicks"],
    ["CTR",val("g3","CTR"),"%","ctr"],
    ["CPC",val("g4","CPC"),"$","cpc"],
    ["CPM",val("g4","CPM"),"$","cpm"],
    ["Конверсия подписная",val("g5","Конверсия подписная"),"%","conv"],
    ["Показы",val("g6","Показы"),"","views"],
  ];
  var html="";
  stats.forEach(function(s){
    var v=s[1], fmt=s[2], key=s[3];
    var display = v===null||v===undefined?"\u2014":(fmt==="$"?"$"+Number(v).toFixed(2):fmt==="%"?Number(v).toFixed(1)+"%":Number(v).toLocaleString());
    html+='<div class="prow'+(v===null||v===undefined?' empty':'')+'"><span class="pl">'+s[0]+'</span><span class="pv">'+display+'</span></div>';
  });
  document.getElementById("pd").textContent=d;
  document.getElementById("pdstats").innerHTML=html;

}
